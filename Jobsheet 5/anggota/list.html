<html lang="id">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../assets/css/Style.css">
    </head>
    <body>
        <header>
            <h1>SIMPUS-Mini</h1>
            <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu" aria-controls="main-nav" aria-expanded="false">&#9776;</button>
            <nav id="main-nav">
            <nav>
                <ul>
                    <li><a href="../index.html">Beranda</a></li>

                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Daftar Anggota</h2>
                <div class="search-box">
                    <label for="search-input">Cari Anggota</label>
                    <input type="text" id="search-input" placeholder="Ketik kata kunci sesuai kolom pilihan...">
                    <!-- Latihan 3 Pencarian yang dibatasi dropdown kolom data. -->
                    <label for="search-column">Kolom pencarian</label>
                    <select id="search-column">
                        <option value="all">Semua Kolom Data</option>
                        <option value="0">No. Anggota</option>
                        <option value="1" selected>Nama</option>
                        <option value="2">Alamat</option>
                        <option value="3">No. HP</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table>
                    <thead>
                        <tr>
                            <th>No. Anggota</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>A001</td>
                            <td>Siti Aminah</td>
                            <td>Malang</td>
                            <td>0812xxxx</td>
                            <td>
                                <button type="button">Edit</button>
                                <button type="button" class="btn-hapus">Hapus</button>
                            </td>
                        </tr>
                        <tr>
                            <td>A002</td>
                            <td>Budi Santoso</td>
                            <td>Batu</td>
                            <td>0813xxxx</td>
                            <td>
                                <button type="button">Edit</button>
                                <button type="button" class="btn-hapus">Hapus</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
        </footer>
        <script src="../assets/js/app.js"></script>
    </body>
</html>
