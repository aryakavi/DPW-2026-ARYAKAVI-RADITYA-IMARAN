<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>KegiatanKita | Daftar Kegiatan</title>
    <link rel="stylesheet" href="../assets/css/Style.css">
</head>
<body>
    <header>
        <h1>KegiatanKita</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu" aria-controls="main-nav" aria-expanded="false">&#9776;</button>
        <nav id="main-nav">
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Kegiatan</a></li>
                <li><a href="../peserta/list.html">Peserta</a></li>
                <li><a href="../pendaftaran/list.html">Pendaftaran</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Kegiatan</h2>
            <p><a href="tambah.html">+ Tambah Kegiatan</a></p>
            <div class="search-box">
                <label for="search-input">Cari Kegiatan</label>
                <input type="text" id="search-input" placeholder="Ketik kata kunci sesuai kolom pilihan...">
                <label for="search-column">Kolom pencarian</label>
                <select id="search-column">
                    <option value="all">Semua Kolom Data</option>
                    <option value="0" selected>Nama Kegiatan</option>
                    <option value="1">Penyelenggara</option>
                    <option value="2">Tahun</option>
                    <option value="3">Kuota</option>
                </select>
            </div>
            <button type="button" id="reload-kegiatan" class="btn-reload">Muat Ulang</button>
            <p id="table-counter" class="table-counter" role="status" aria-live="polite" data-label="kegiatan">Menampilkan 0 dari 0 kegiatan</p>
            <p id="loading-indicator" role="status" style="display:none;">Memuat data...</p>
            <div class="table-responsive">
                <table>
                <thead>
                    <tr>
                        <th>Nama Kegiatan</th>
                        <th>Penyelenggara</th>
                        <th>Tahun</th>
                        <th>Kuota</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KegiatanKita</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/kegiatan.js"></script>
</body>
</html>
