<!DOCTYPE html>
<html lang="id">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>SIMPLUS-Mini | Daftar Anggota</title>
        <link rel="stylesheet" href="../assets/css/Style.css">
    </head>
    <body>
        <header>
            <h1>SIMPUS-Mini</h1>
            <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu" aria-controls="main-nav" aria-expanded="false">&#9776;</button>
            <nav id="main-nav">
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="../buku/list.html">Daftar Buku</a></li>
                    <li><a href="list.html">Daftar Anggota</a></li>
                    <li><a href="anggota.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Daftar Anggota</h2>
                <div class="search-box">
                    <label for="search-input">Cari Anggota</label>
                    <input type="text" id="search-input" placeholder="Ketik kata kunci sesuai kolom pilihan...">
                    <!-- Latihan 3 Pencarian yang dibatasi dropdown kolom data. -->
                    <label for="search-column">Kolom pencarian</label>
                    <select id="search-column">
                        <option value="all">Semua Kolom Data</option>
                        <option value="0">No. Anggota</option>
                        <option value="1" selected>Nama</option>
                        <option value="2">Alamat</option>
                        <option value="3">No. HP</option>
                    </select>
                </div>
                <!-- Latihan 4 menambah label counter sesuai jenis data anggota -->
                <p id="table-counter" class="table-counter" role="status" aria-live="polite" data-label="anggota">Menampilkan 0 dari 0 anggota</p>
                <p id="loading-indicator" role="status" style="display:none;">Memuat data...</p>
                <div class="table-responsive">
                    <table>
                    <thead>
                        <tr>
                            <th>No. Anggota</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
        </footer>
        <script src="../assets/js/app.js"></script>
    </body>
</html>
