<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/Style.css">
</head>
<body>
    <header>
        <h1>SIMPLUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu" aria-controls="main-nav" aria-expanded="false">&#9776;</button>
        <nav id="main-nav">
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            <div class="search-box">
                <label for="search-input">Cari Buku</label>
                <input type="text" id="search-input" placeholder="Ketik kata kunci sesuai kolom pilihan...">
                <!-- Latihan 3 Pencarian yang dibatasi menurut dropdown kolom data -->
                <label for="search-column">Kolom pencarian</label>
                <select id="search-column">
                    <option value="all">Semua Kolom Data</option>
                    <option value="0" selected>Judul</option>
                    <option value="1">Pengarang</option>
                    <option value="2">Tahun</option>
                    <option value="3">Stok</option>
                </select>
            </div>
            <button type="button" id="reload-buku" class="btn-reload">Muat Ulang</button>
            <!-- latihan 4 counter diperbarui JS, total awal tetap-->
            <p id="table-counter" class="table-counter" role="status" aria-live="polite" data-label="buku">Menampilkan 0 dari 0 buku</p>
            <p id="loading-indicator" role="status" style="display:none;">Memuat data...</p>
            <div class="table-responsive">
                <table>
                <thead>
                    <tr>
                        <th>Judul</th>
                        <th>Pengarang</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
